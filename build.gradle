import java.text.SimpleDateFormat

// https://docs.gradle.org/current/userguide/java_gradle_plugin.html
// https://plugins.gradle.org/docs/publish-plugin

plugins {
    id("groovy-gradle-plugin")    
    id("maven-publish")
    //Questo va attivato al posto di maven-publish 
    //id("com.gradle.plugin-publish") version "1.3.0"
}

project.ext {
    Date buildTimeAndDate = new Date()
    buildDate = new SimpleDateFormat("dd-MM-yyyy").format(buildTimeAndDate)
    buildTime = new SimpleDateFormat("HH:mm:ss.SSSZ").format(buildTimeAndDate)
    snapshotRepository = "https://www.rebirth-project.it/artifactory/lib-snapshot-local"
    releaseRepository = "https://www.rebirth-project.it/artifactory/lib-release-local"
}

println """
----------------------------------------------------------------
Project ===> group: ${project.group}, name: ${project.name}, version: ${project.version}
Gradle wrapper version: ${project.getGradle().getGradleVersion()}
Gradle groovy version: ${GroovySystem.getVersion()}
Java version: ${System.getProperty("java.version")}
----------------------------------------------------------------"""

wrapper {
    gradleVersion = "9.1.0"
}

configurations {
    mockitoAgent
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    doFirst {
        jvmArgs("-javaagent:${configurations.mockitoAgent.singleFile}")
    }
} 

dependencies {
    implementation "it.rebirthproject:version-comparator:1.1.2"
    implementation "org.apache.groovy:groovy-toml:5.0.1"
   
    testImplementation "org.mockito:mockito-junit-jupiter:5.20.0"
    mockitoAgent('org.mockito:mockito-core:5.18.0') { transitive = false }
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:6.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:6.0.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jar {
    manifest.attributes(
            "Specification-Title": project.name,
            "Specification-Vendor": project.ext.author,
            "Specification-Version": project.version,
            "Implementation-Title": project.name,
            "Implementation-Vendor": project.ext.author,
            "Implementation-Version": project.version,
            "Build-Date": project.ext.buildDate,
            "Build-Time": project.ext.buildTime
    )
}

// Use java-gradle-plugin/groovy-gradle-plugin to generate plugin descriptors and specify both global and individual plugin properties.
// The names of the blocks inside "plugins" need to be unique, they will identify the plugins being configured.
// All properties are mandatory.
gradlePlugin {
    website = project.ext.authorWebsite
    vcsUrl = project.ext.pluginWebsite
    plugins {
        create("catalogDependenciesMonitorPlugin") {
            id = "it.rebirthproject.catalog-dependencies-monitor"
            implementationClass = "it.rebirthproject.catalog_dependencies_monitor.gradle.plugins.CatalogDependenciesMonitorPlugin"
            displayName = "Gradle Catalog Dependencies Monitor Plugin"
            description = "Plugin for monitoring Gradle catalog dependencies. It generates reports to inform you about which dependencies in your catalog are up-to-date or need updating."
            tags.set(["catalog", "monitor", "dependencies", "update", "updates", "library", "libraries"])
        }
    }
}

publishing {
    repositories {
        maven {
            credentials {
                username = findProperty("RebirthArtifactoryUser")
                password = findProperty("RebirthArtifactoryPassword")
            }
            url = version.endsWith("SNAPSHOT") ? snapshotRepository : releaseRepository
        }
    }
}